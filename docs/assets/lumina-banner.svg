<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Lumina Browser — Neon Glass</title>
  <desc id="desc">A dark cosmic banner with cyan and violet orbital light, glass panels, and the Lumina Browser title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05060A"/><stop offset=".55" stop-color="#0B1020"/><stop offset="1" stop-color="#140B25"/></linearGradient>
    <radialGradient id="cyan"><stop stop-color="#00D9FF" stop-opacity=".32"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#9B5CFF" stop-opacity=".35"/><stop offset="1" stop-color="#9B5CFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00D9FF" stop-opacity=".8"/><stop offset="1" stop-color="#9B5CFF" stop-opacity=".8"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".12"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".025"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <circle cx="250" cy="140" r="390" fill="url(#cyan)"/>
  <circle cx="1320" cy="510" r="430" fill="url(#violet)"/>
  <g fill="#D9F8FF" opacity=".75">
    <circle cx="125" cy="93" r="2"/><circle cx="380" cy="480" r="1.5"/><circle cx="560" cy="110" r="1.3"/><circle cx="1040" cy="86" r="1.7"/><circle cx="1430" cy="155" r="1.5"/><circle cx="1510" cy="405" r="2"/><circle cx="900" cy="520" r="1.3"/><circle cx="710" cy="390" r="1.5"/>
  </g>
  <g transform="translate(1120 290)">
    <ellipse rx="290" ry="112" fill="none" stroke="#00D9FF" stroke-opacity=".16" stroke-width="22" filter="url(#glow)" transform="rotate(-24)"/>
    <ellipse rx="290" ry="112" fill="none" stroke="url(#line)" stroke-width="2" transform="rotate(-24)"/>
    <ellipse rx="205" ry="75" fill="none" stroke="#9B5CFF" stroke-opacity=".7" stroke-width="1.5" transform="rotate(36)"/>
    <circle r="92" fill="#00D9FF" opacity=".13" filter="url(#glow)"/>
    <circle r="74" fill="url(#glass)" stroke="#8DEEFF" stroke-opacity=".65" stroke-width="1.5"/>
    <path d="M-24 -38 L25 0 L-24 38 Z" fill="none" stroke="#00D9FF" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="250" cy="-104" r="6" fill="#00D9FF"/><circle cx="-215" cy="105" r="5" fill="#9B5CFF"/>
  </g>
  <g transform="translate(108 178)">
    <rect x="0" y="0" width="620" height="282" rx="26" fill="url(#glass)" stroke="url(#line)" stroke-opacity=".5"/>
    <rect x="22" y="22" width="576" height="38" rx="12" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".08"/>
    <circle cx="43" cy="41" r="4" fill="#FF6D9A"/><circle cx="58" cy="41" r="4" fill="#FFC66D"/><circle cx="73" cy="41" r="4" fill="#00D9FF"/>
    <rect x="95" y="33" width="270" height="16" rx="8" fill="#D7E5F5" fill-opacity=".12"/>
    <rect x="24" y="84" width="572" height="174" rx="18" fill="#070B15" fill-opacity=".55"/>
    <path d="M58 125 H245 M58 149 H320 M58 173 H210" stroke="#B7C9DE" stroke-opacity=".23" stroke-width="8" stroke-linecap="round"/>
    <rect x="58" y="204" width="136" height="28" rx="14" fill="#00D9FF" fill-opacity=".14" stroke="#00D9FF" stroke-opacity=".7"/>
    <rect x="208" y="204" width="110" height="28" rx="14" fill="#9B5CFF" fill-opacity=".14" stroke="#9B5CFF" stroke-opacity=".7"/>
  </g>
  <text x="110" y="100" fill="#00D9FF" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="8">NEXT-GEN ANDROID BROWSER</text>
  <text x="110" y="535" fill="#F4F8FF" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="5">LUMINA</text>
  <text x="114" y="575" fill="#A8B6CE" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2">EXPLORE THE WEB IN A NEW LIGHT</text>
  <path d="M110 600 H510" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
</svg>